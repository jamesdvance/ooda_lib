version: '3.8'

services:
  # Video recording service (add GPU back for inference later)
  inference:
    build:
      context: .
      dockerfile: Dockerfile.inference
    image: ooda-inference:latest
    container_name: ooda-inference
    restart: unless-stopped

    deploy:
      resources:
        reservations:
          cpus: '1.0'
          memory: 1G
        limits:
          cpus: '4.0'
          memory: 4G

    environment:
      - OODA_INFERENCE_ENABLED=false
      - OODA_VIDEO_CODEC=XVID
      - OODA_RECORDING_DIR=/data/recordings
      - OODA_BUFFER_DIR=/data/video_buffer
      - OODA_LOG_FILE=/var/log/ooda/inference.log
      - OODA_LOG_LEVEL=${OODA_LOG_LEVEL:-INFO}

    volumes:
      - shared-data:/data
      - shared-logs:/var/log/ooda

    devices:
      - /dev/video0:/dev/video0
    group_add:
      - video

    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s

  # Lightweight upload sidecar service
  uploader:
    build:
      context: .
      dockerfile: Dockerfile.uploader
    image: ooda-uploader:latest
    container_name: ooda-uploader
    restart: unless-stopped
    depends_on:
      - inference

    # Load all config from the generated .env file
    env_file:
      - ./upload/.env

    environment:
      - OODA_BUFFER_DIR=/data/video_buffer
      - OODA_LOG_FILE=/var/log/ooda/upload.log

    volumes:
      - shared-data:/data
      - shared-logs:/var/log/ooda

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    healthcheck:
      test: ["CMD", "python", "-c", "from upload import Upload; u = Upload(); u.get_status()"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s

# Shared volumes between services (sidecar pattern)
volumes:
  shared-data:
    driver: local
  shared-logs:
    driver: local
